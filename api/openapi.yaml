          type: string
        permission:
          type: string
        resource:
          $ref: "#/components/schemas/ResourceRef"
    LegacyAccessLevel:
      type: string
      enum: [read, write, admin]
    LegacyAccessChange:
      type: object
      additionalProperties: false
      required: [user_id, model_id, access]
