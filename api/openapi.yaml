          $ref: "#/components/schemas/Binding"
    Resource:
      type: object
      additionalProperties: false
      required: [id, type, name, status]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ResourceType"
        name:
          type: string
        status:
          type: string
        parent:
          $ref: "#/components/schemas/ResourceRef"
    CreateResource:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        name:
          type: string
          minLength: 1
        parent:
          $ref: "#/components/schemas/ResourceRef"
    ApplicationConfig:
      type: object
      additionalProperties:
        type: string
    OperationResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
