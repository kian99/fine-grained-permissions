        user_id:
          type: string
        model_id:
          type: string
        access:
          $ref: "#/components/schemas/LegacyAccessLevel"
    LegacyRevokeResult:
      type: object
      additionalProperties: false
      required: [effective_access, still_authorized]
      properties:
        effective_access:
